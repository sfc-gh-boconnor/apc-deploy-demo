version: 2

models:
  - name: mart_product_cost
    description: "Analysis-ready Actual vs Budget vs Standard cost by material x plant x period. Built from RAW SAP via the dbt pipeline; parity with ANALYTICS.PRODUCT_COST_SUMMARY."
    columns:
      - name: material_number
        description: "Material number; must exist in the material master."
        tests:
          - not_null
          - relationships:
              to: ref('stg_material_master')
              field: material_number
      - name: actual_cost_per_unit
        tests: [not_null]
      - name: standard_cost_per_unit
        tests: [not_null]
      - name: cost_variance_pct
        tests: [not_null]
      - name: variance_flag
        tests:
          - accepted_values:
              values: ['HIGH', 'MEDIUM', 'LOW']

  - name: mart_cost_budget
    description: "Period budget (prior-year actual) per material x plant x period. Parity with SAP_BDC.COST_BUDGET."
    columns:
      - name: budget_cost
        tests: [not_null]

  - name: mart_cost_component_detail
    description: "Standard vs actual by cost component, in USD. Parity with ANALYTICS.COST_COMPONENT_DETAIL."
    columns:
      - name: material_number
        tests: [not_null]
      - name: cost_component
        tests: [not_null]

  - name: mart_product_cost_monthly
    description: "Cost summary aggregated to material x period across all plants."
    columns:
      - name: material_number
        tests: [not_null]
      - name: avg_variance_pct
        tests: [not_null]

  - name: mart_product_profitability
    description: "CO-PA style profitability — SD revenue vs CO-PC cost by material x market x period. Parity with ANALYTICS.PRODUCT_PROFITABILITY."
    columns:
      - name: MATERIAL_NUMBER
        tests: [not_null]
      - name: REVENUE
        tests: [not_null]

  - name: mart_cost_anomalies
    description: "Statistical cost-component anomalies (z-score). Parity with ANALYTICS.COST_ANOMALIES."
    columns:
      - name: MATERIAL_NUMBER
        tests: [not_null]
      - name: Z_SCORE
        tests: [not_null]

  - name: mart_product_risk_scores
    description: "Per-product variance trajectory + next-period projection. Parity with ANALYTICS.PRODUCT_RISK_SCORES."
    columns:
      - name: MATERIAL_NUMBER
        tests: [not_null, unique]
      - name: RISK_LEVEL
        tests:
          - accepted_values:
              values: ['HIGH', 'MEDIUM', 'LOW']

  - name: mart_variance_trend_with_forecast
    description: "Portfolio variance actuals + ML forecast. Parity with ANALYTICS.VARIANCE_TREND_WITH_FORECAST."
    columns:
      - name: DATA_TYPE
        tests:
          - accepted_values:
              values: ['actual', 'forecast']

  - name: mart_sales_forecast
    description: "Sales revenue + volume actuals (FY2026 H1) unioned with ML forecast (H2). Includes cost-based margin forecast — shows how cost variance compresses H2 gross margin by product."
    columns:
      - name: MATERIAL_NUMBER
        tests: [not_null]
      - name: DATA_TYPE
        tests:
          - accepted_values:
              values: ['actual', 'forecast']

  - name: mart_bom_cost_buildup
    description: "Full costed BOM roll-up per finished product — material + conversion + estimated overhead by level."
    columns:
      - name: material_number
        tests: [not_null]
      - name: bom_total_cost_usd
        tests: [not_null]

  - name: mart_fmc_vs_bom
    description: "FMC reported cost vs BOM-exploded cost — variance highlights data quality gaps (missing BOMs, cost build-up issues)."
    columns:
      - name: material_number
        tests: [not_null]
      - name: reconciliation_status
        tests:
          - accepted_values:
              values: ['RECONCILED', 'MEDIUM_VARIANCE', 'HIGH_VARIANCE', 'MISSING_BOM', 'MISSING_FMC']

  - name: mart_volume_alignment
    description: "Volume alignment dashboard — APO planned vs commercial forecast vs actual billing, with revenue gap estimates."
    columns:
      - name: material_number
        tests: [not_null]
      - name: alignment_status
        tests:
          - accepted_values:
              values: ['ALIGNED', 'HIGH_DEVIATION', 'MEDIUM_DEVIATION', 'NO_BILLING', 'UNPLANNED_DEMAND']

  - name: mart_value_chain_pnl
    description: "Value chain P&L — CO-PA by value chain step showing interco margins, transport, SCC adjustments, and end-to-end margin."
    columns:
      - name: material_number
        tests: [not_null]
      - name: chain_step
        tests: [not_null]

  - name: mart_cogm_evolution
    description: "COGM evolution tracked by site/brand/country/TA over time — cost trajectory with rolling averages."
    columns:
      - name: material_number
        tests: [not_null]
      - name: cost_trajectory
        tests:
          - accepted_values:
              values: ['ESCALATING', 'IMPROVING', 'STABLE']

  - name: mart_rate_stability
    description: "Activity rate movement tracking — flags unstable rates that may indicate data quality or planning issues."
    columns:
      - name: cost_centre
        tests: [not_null]
      - name: stability_status
        tests:
          - accepted_values:
              values: ['STABLE', 'WATCH', 'UNSTABLE', 'NEW_RATE']
